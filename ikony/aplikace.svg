<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="60%">
      <stop offset="0" stop-color="#3d1218"/>
      <stop offset="1" stop-color="#120809"/>
    </radialGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9bec5"/>
      <stop offset="0.55" stop-color="#7d838c"/>
      <stop offset="1" stop-color="#555a62"/>
    </linearGradient>
    <linearGradient id="piston" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6b7179"/>
      <stop offset="0.45" stop-color="#d2d6db"/>
      <stop offset="1" stop-color="#6b7179"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffe27a" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#ffb52e" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ff9a1f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bulb" cx="40%" cy="35%" r="65%">
      <stop offset="0" stop-color="#fffbe0"/>
      <stop offset="0.5" stop-color="#ffd94a"/>
      <stop offset="1" stop-color="#e89a12"/>
    </radialGradient>
    <clipPath id="inner"><circle cx="512" cy="512" r="452"/></clipPath>
  </defs>
  <circle cx="512" cy="512" r="508" fill="#170b0d"/>
  <circle cx="512" cy="512" r="470" fill="url(#bg)"/>
  <circle cx="512" cy="512" r="470" fill="none" stroke="#b3141f" stroke-width="36"/>
  <g clip-path="url(#inner)">
    <!-- glow behind the bulb -->
    <circle cx="512" cy="300" r="190" fill="url(#glow)"/>
    <!-- pistons -->
    <rect x="318" y="350" width="104" height="150" rx="14" fill="url(#piston)" stroke="#1b1c1f" stroke-width="14"/>
    <ellipse cx="370" cy="350" rx="52" ry="18" fill="#c9cdd2" stroke="#1b1c1f" stroke-width="12"/>
    <rect x="602" y="390" width="104" height="110" rx="14" fill="url(#piston)" stroke="#1b1c1f" stroke-width="14"/>
    <ellipse cx="654" cy="390" rx="52" ry="18" fill="#c9cdd2" stroke="#1b1c1f" stroke-width="12"/>
    <!-- bulb on a stalk -->
    <rect x="496" y="330" width="32" height="150" fill="#3a3e45" stroke="#1b1c1f" stroke-width="10"/>
    <circle cx="512" cy="300" r="62" fill="url(#bulb)" stroke="#1b1c1f" stroke-width="14"/>
    <!-- body -->
    <rect x="250" y="480" width="524" height="300" rx="34" fill="url(#metal)" stroke="#1b1c1f" stroke-width="16"/>
    <rect x="300" y="530" width="424" height="168" rx="16" fill="#33373e" stroke="#1b1c1f" stroke-width="12"/>
    <g stroke="#79808a" stroke-width="18" stroke-linecap="round">
      <line x1="338" y1="568" x2="686" y2="568"/>
      <line x1="338" y1="614" x2="686" y2="614"/>
      <line x1="338" y1="660" x2="686" y2="660"/>
    </g>
    <g fill="#2a2d33">
      <circle cx="286" cy="516" r="11"/><circle cx="738" cy="516" r="11"/>
      <circle cx="286" cy="744" r="11"/><circle cx="738" cy="744" r="11"/>
    </g>
    <!-- feet -->
    <rect x="292" y="772" width="110" height="44" rx="10" fill="#2b2e34" stroke="#1b1c1f" stroke-width="12"/>
    <rect x="622" y="772" width="110" height="44" rx="10" fill="#2b2e34" stroke="#1b1c1f" stroke-width="12"/>
    <!-- sparks -->
    <g fill="#ffd23f" stroke="#7a3f00" stroke-width="8" stroke-linejoin="round">
      <polygon points="214,336 286,392 252,402 300,462 214,410 248,398"/>
      <polygon points="812,316 742,382 776,392 728,450 814,398 780,386"/>
      <polygon points="806,520 860,548 834,560 866,600 806,570 832,560"/>
    </g>
  </g>
</svg>
