name: Testy a sestavení

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Testy (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Nástroje
        run: pip install "rapidfuzz>=3" "pytest>=8" "ruff==0.17.6"

      - name: Kontrola kódu (ruff)
        run: ruff check app tests

      - name: Testy (pytest)
        run: pytest -v

  build:
    name: Sestavení .exe
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write        # vytvoření vydání
      id-token: write        # podepsané potvrzení původu (attestation)
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Knihovny
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt "pyinstaller>=6.6"

      - name: Rychlejší snímání obrazovky (volitelné)
        continue-on-error: true
        run: pip install "dxcam==0.3.0"

      - name: Sestavení
        run: pyinstaller --noconfirm --clean build/dbd-rich-presence.spec

      - name: Kontrola .exe
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\DbD-Rich-Presence.exe" -ArgumentList "--self-test", "selftest.json" -Wait -PassThru
          Get-Content selftest.json
          "Velikost: {0:N0} MB" -f ((Get-Item dist\DbD-Rich-Presence.exe).Length / 1MB)
          (Get-Item dist\DbD-Rich-Presence.exe).VersionInfo | Format-List ProductName, FileVersion, FileDescription, LegalCopyright
          if ($p.ExitCode -ne 0) { throw "Kontrola .exe selhala" }

      - name: Otisk SHA256
        shell: pwsh
        run: |
          $h = (Get-FileHash dist\DbD-Rich-Presence.exe -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText("dist\DbD-Rich-Presence.exe.sha256", "$h  DbD-Rich-Presence.exe`n")
          "SHA256: $h"
          "EXE_SHA256=$h" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Potvrzení původu (attestation)
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/DbD-Rich-Presence.exe

      - uses: actions/upload-artifact@v4
        with:
          name: DbD-Rich-Presence
          path: |
            dist/DbD-Rich-Presence.exe
            dist/DbD-Rich-Presence.exe.sha256

      - name: Vydání ke stažení
        # Nové vydání vznikne jen při nové verzi v app/version.py, takže .exe ve vydání
        # vždycky odpovídá commitu, na kterém je štítek verze.
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = (Select-String -Path app/version.py -Pattern 'VERSION = "(.+)"').Matches[0].Groups[1].Value
          $tag = "v$v"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            "Vydání $tag už existuje, nic nenahrávám (pro nové vydání zvyš VERSION v app/version.py)."
            exit 0
          }
          $repo = $env:GITHUB_REPOSITORY
          $run = "$env:GITHUB_SERVER_URL/$repo/actions/runs/$env:GITHUB_RUN_ID"
          $notes = Get-Content .github/release-notes.md -Raw -Encoding utf8
          $notes = $notes.Replace("{REPO}", $repo).Replace("{SHA}", $env:GITHUB_SHA).Replace("{RUN}", $run)
          $notes = $notes.Replace("{SHORT}", $env:GITHUB_SHA.Substring(0, 7)).Replace("{HASH}", $env:EXE_SHA256)
          [IO.File]::WriteAllText("release-notes.md", $notes)
          gh release create $tag dist/DbD-Rich-Presence.exe dist/DbD-Rich-Presence.exe.sha256 `
            --target $env:GITHUB_SHA --title "DbD Rich Presence $v" --notes-file release-notes.md --latest
          exit $LASTEXITCODE
