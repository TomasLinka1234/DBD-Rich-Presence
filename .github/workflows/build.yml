name: Sestavení .exe

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Knihovny
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt "pyinstaller>=6.6"

      - name: Rychlejší snímání obrazovky (volitelné)
        continue-on-error: true
        run: pip install "dxcam==0.3.0"

      - name: Sestavení
        run: pyinstaller --noconfirm --clean build/dbd-rich-presence.spec

      - name: Kontrola .exe
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\DbD-Rich-Presence.exe" -ArgumentList "--self-test", "selftest.json" -Wait -PassThru
          Get-Content selftest.json
          "Velikost: {0:N0} MB" -f ((Get-Item dist\DbD-Rich-Presence.exe).Length / 1MB)
          if ($p.ExitCode -ne 0) { throw "Kontrola .exe selhala" }

      - uses: actions/upload-artifact@v4
        with:
          name: DbD-Rich-Presence
          path: dist/DbD-Rich-Presence.exe

      - name: Vydání ke stažení
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = (Select-String -Path app/version.py -Pattern 'VERSION = "(.+)"').Matches[0].Groups[1].Value
          $tag = "v$v"
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag dist/DbD-Rich-Presence.exe --title "DbD Rich Presence $v" --notes "Stáhni **DbD-Rich-Presence.exe** a spusť ho. Návod je v NAVOD.md." --latest
          } else {
            gh release upload $tag dist/DbD-Rich-Presence.exe --clobber
          }
